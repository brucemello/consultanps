name: Diagnóstico de implantações

# Lista as implantações do Apps Script e mostra quais são Web App.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configurar clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: ./scripts/setup-clasp.sh
      - name: Listar implantações
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          clasp deployments > /dev/null
          CID=$(echo "$CLASPRC_JSON" | jq -r '.oauth2ClientSettings.clientId // .tokens.default.client_id // empty')
          CSEC=$(echo "$CLASPRC_JSON" | jq -r '.oauth2ClientSettings.clientSecret // .tokens.default.client_secret // empty')
          RT=$(echo "$CLASPRC_JSON" | jq -r '.token.refresh_token // .tokens.default.refresh_token')
          if [ -n "$CID" ]; then
            AT=$(curl -s https://oauth2.googleapis.com/token -d client_id="$CID" -d client_secret="$CSEC" -d refresh_token="$RT" -d grant_type=refresh_token | jq -r .access_token)
          else
            AT=$(jq -r '.token.access_token // .tokens.default.access_token' ~/.clasprc.json)
          fi
          curl -s -H "Authorization: Bearer $AT" "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments" > /tmp/d.json
          jq -r --arg D "$DEPLOYMENT_ID" '.deployments[]? | "\(.deploymentId[0:14])… | secret=\(if .deploymentId==$D then "SIM" else "não" end) | v=\(.deploymentConfig.versionNumber // "HEAD") | \(.deploymentConfig.description // "") | entradas=\([.entryPoints[]?.entryPointType] | join(",")) | webapp=\([.entryPoints[]? | select(.entryPointType=="WEB_APP") | .webApp.url[0:70]] | join("")) | acesso=\([.entryPoints[]? | select(.entryPointType=="WEB_APP") | .webApp.entryPointConfig.access] | join(","))"' /tmp/d.json
          jq -r '.error.message // empty' /tmp/d.json
