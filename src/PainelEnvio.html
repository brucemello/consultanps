<!-- Módulo do Painel gerado a partir de EnvioResumo.html -->
<section class="view" id="v-env">
<div class="wrap">
  <div class="hero">
    <div>
      <small>NPS Produto · Protheus</small>
      <h1>Enviar resumo do NPS</h1>
      <p id="e-sub">Carregando…</p>
    </div>
    <div class="per">
      <div><label>De</label><select id="e-pDe"></select></div>
      <div><label>Até</label><select id="e-pAte"></select></div>
      <button class="btn btn-ghost" id="e-btnCad">👥 Editar cadastro</button>
    </div>
  </div>

  <div class="main" id="e-main">
    <div class="loading"><div><div class="spin"></div>Montando os e-mails…</div></div>
  </div>

  <div class="foot">
    <div class="msg info" id="e-msg">Revise a prévia de cada destinatário antes de enviar.</div>
    <button class="btn btn-light" id="e-btnTeste" disabled>Enviar teste para mim</button>
    <button class="btn btn-primary" id="e-btnEnviar" disabled>Enviar para todos</button>
  </div>
</div>
</section>
<style>
#v-env { --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --bg:#f4f6fb; --blue:#2563eb; --blue-soft:#eef3ff;
            --green:#16a34a; --green-soft:#ecfdf3; --red:#dc2626; --red-soft:#fef2f2; --amber:#b45309; --amber-soft:#fff7e6; }
#v-env * { box-sizing:border-box; margin:0; padding:0; }
#v-env { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
#v-env .wrap { padding:18px; height:100vh; display:flex; flex-direction:column; gap:14px; }
#v-env .hero { background:linear-gradient(120deg,#0b1f3a 0%,#13325e 60%,#1d4ed8 140%); color:#fff; border-radius:16px; padding:16px 22px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex:none; }
#v-env .hero small { text-transform:uppercase; letter-spacing:.12em; font-size:11px; color:#9fb6dc; font-weight:600; }
#v-env .hero h1 { font-size:20px; font-weight:800; margin-top:4px; }
#v-env .hero p { color:#c6d4ee; font-size:13px; margin-top:4px; }
#v-env .btn { display:inline-flex; align-items:center; gap:6px; border-radius:10px; padding:9px 14px; font-weight:600; font-size:13px; border:1px solid transparent; cursor:pointer; font-family:inherit; white-space:nowrap; }
#v-env .btn-primary { background:var(--blue); color:#fff; }
#v-env .btn-primary:hover { background:#1d4ed8; }
#v-env .btn-light { background:#fff; color:var(--ink); border-color:var(--line); }
#v-env .btn-light:hover { border-color:#cbd5e1; }
#v-env .btn-ghost { background:rgba(255,255,255,.1); color:#fff; border-color:rgba(255,255,255,.25); }
#v-env .btn:disabled { opacity:.55; cursor:not-allowed; }
#v-env .main { display:grid; grid-template-columns:330px 1fr; gap:14px; flex:1; min-height:0; }
#v-env .side { background:#fff; border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; min-height:0; }
#v-env .side h3 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:14px 14px 6px; }
#v-env .list { overflow:auto; padding:0 8px 8px; flex:1; }
#v-env .item { display:flex; gap:10px; align-items:center; padding:10px; border-radius:10px; cursor:pointer; border:1px solid transparent; }
#v-env .item:hover { background:#f8fafc; }
#v-env .item.on { background:var(--blue-soft); border-color:#c7d7fe; }
#v-env .av { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:12px; flex:none; }
#v-env .av.tl { background:#e0e7ff; color:#3730a3; }
#v-env .av.g { background:#dcfce7; color:#166534; }
#v-env .item .t { flex:1; min-width:0; }
#v-env .item b { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#v-env .item span { display:block; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#v-env .nps { font-weight:800; font-size:13px; padding:3px 8px; border-radius:8px; }
#v-env .preview { background:#fff; border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
#v-env .phead { padding:12px 16px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink2); line-height:1.6; }
#v-env .phead b { color:var(--ink); }
#v-env iframe { border:0; flex:1; width:100%; background:#eef1f6; }
#v-env .foot { display:flex; align-items:center; gap:10px; flex:none; }
#v-env .msg { flex:1; font-size:13px; border-radius:10px; padding:9px 12px; }
#v-env .msg.ok { background:var(--green-soft); color:var(--green); }
#v-env .msg.err { background:var(--red-soft); color:var(--red); }
#v-env .msg.warn { background:var(--amber-soft); color:var(--amber); }
#v-env .msg.info { background:#fff; color:var(--muted); border:1px solid var(--line); }
#v-env .per { display:flex; gap:8px; align-items:flex-end; }
#v-env .per label { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:#9fb6dc; font-weight:700; margin-bottom:4px; }
#v-env .per select { font-family:inherit; font-size:13px; font-weight:600; border-radius:9px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:#fff; padding:8px 10px; cursor:pointer; }
#v-env .per select option { color:#0f172a; }
#v-env .empty { padding:30px; text-align:center; color:var(--muted); }
#v-env .loading { display:grid; place-items:center; flex:1; color:var(--ink2); font-weight:600; }
#v-env .spin { width:30px; height:30px; border:3px solid #dbe3f3; border-top-color:var(--blue); border-radius:50%; animation: v-env-s .8s linear infinite; margin:0 auto 10px; }
@keyframes v-env-s { to { transform:rotate(360deg); } }

  </style>
<script>
(function () {
  const ROOT = document.getElementById('v-env');

  const $ = id => document.getElementById('e-' + id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const CTX = window.PAINEL.ctx;
  let D = null, sel = 0, PER = CTX.periodoEscolhido ? { mesInicio: CTX.periodoEscolhido.mesInicio, mesFim: CTX.periodoEscolhido.mesFim } : null;
  const perJson = () => PER ? JSON.stringify(PER) : null;

  $('btnCad').onclick = () => PAINEL.ir('cad');
  $('btnTeste').onclick = () => enviar('teste');
  $('btnEnviar').onclick = () => {
    const n = D.envios.length, tl = D.envios.filter(e => e.tipo === 'TL').length;
    if (!confirm(`Enviar ${n} e-mail(s) agora com o período ${D.rotulo}?\n\n• ${tl} para TLs\n• ${n - tl} para gestores`)) return;
    enviar('real');
  };

  ['pDe', 'pAte'].forEach(id => $(id).addEventListener('change', () => {
    if ($('pDe').value > $('pAte').value) { if (id === 'pDe') $('pAte').value = $('pDe').value; else $('pDe').value = $('pAte').value; }
    PER = { mesInicio: $('pDe').value, mesFim: $('pAte').value }; carregar();
  }));
  PAINEL.modulos.env = {
    mostrar(o) { if (o && o.periodo) PER = o.periodo; if (!D || (o && o.periodo)) carregar(); },
    invalidar() { D = null; }
  };

  function carregar() {
    $('btnTeste').disabled = $('btnEnviar').disabled = true;
    $('main').innerHTML = '<div class="loading"><div><div class="spin"></div>Montando os e-mails…</div></div>';
    google.script.run.withSuccessHandler(j => { D = JSON.parse(j); sel = Math.min(sel, Math.max(0, D.envios.length - 1)); seletor(); render(); })
      .withFailureHandler(e => { $('main').innerHTML = `<div class="empty">Erro ao montar os e-mails: ${esc(e.message)}</div>`; })
      .previewResumo(perJson());
  }

  function seletor() {
    const meses = D.meses.slice();
    [D.periodo.mesInicio, D.periodo.mesFim].forEach(m => { if (!meses.includes(m)) meses.push(m); });
    meses.sort();
    const op = meses.map(m => `<option value="${m}">${nomeMes(m)}</option>`).join('');
    $('pDe').innerHTML = op; $('pAte').innerHTML = op;
    $('pDe').value = D.periodo.mesInicio; $('pAte').value = D.periodo.mesFim;
  }

  function zona(n) {
    if (n == null) return ['#64748b', '#f1f5f9'];
    if (n >= 75) return ['#067647', '#e3f7ea']; if (n >= 50) return ['#15803d', '#e9f8ef'];
    if (n >= 0) return ['#a15c07', '#fff4dc']; return ['#b42318', '#fdeced'];
  }
  const nomeMes = m => { const [y, mm] = m.split('-'); return `${MESES[+mm - 1]}/${y}`; };
  const fmt = n => n == null ? '—' : n.toFixed(1).replace('.', ',');
  const ini = s => String(s || '?').split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();

  function render() {
    $('sub').textContent = `Período ${D.periodo.inicio} a ${D.periodo.fim} · último mês em destaque: ${nomeMes(D.periodo.mesFim)}`;
    if (!D.temDados) msg('warn', 'A Base Histórica está vazia — importe o relatório do Fluig antes de enviar.');
    else if (!D.temMesFim) msg('warn', `A base não tem respostas de ${nomeMes(D.periodo.mesFim)}. Confira o período antes de enviar.`);
    else msg('info', `Revise a prévia de cada destinatário antes de enviar · período ${esc(D.rotulo)}.`);
    if (!D.envios.length) {
      $('main').innerHTML = `<div class="side" style="grid-column:1/-1"><div class="empty">Nenhum destinatário ativo.<br><br><button class="btn btn-primary" onclick="PAINEL.ir('cad')">Cadastrar times e gestores</button></div></div>`;
      return;
    }
    const tls = D.envios.map((e, i) => [e, i]).filter(([e]) => e.tipo === 'TL');
    const gs = D.envios.map((e, i) => [e, i]).filter(([e]) => e.tipo === 'Gestor');
    const item = ([e, i]) => { const [c, bg] = zona(e.nps); return `<div class="item ${i === sel ? 'on' : ''}" data-i="${i}">
      <div class="av ${e.tipo === 'TL' ? 'tl' : 'g'}">${esc(ini(e.nome))}</div>
      <div class="t"><b>${esc(e.nome)}</b><span>${esc(e.tipo === 'TL' ? 'TL · ' + e.time : e.time)}</span></div>
      <span class="nps" style="color:${c};background:${bg}" title="NPS do período ${esc(D.rotulo)}">${fmt(e.nps)}</span></div>`; };
    $('main').innerHTML = `<div class="side">
        <h3>TLs · ${tls.length}</h3><div class="list" style="flex:none">${tls.map(item).join('') || '<div class="empty">Nenhum</div>'}</div>
        <h3>Gestores · ${gs.length}</h3><div class="list">${gs.map(item).join('') || '<div class="empty">Nenhum</div>'}</div>
      </div>
      <div class="preview"><div class="phead" id="e-phead"></div><iframe id="e-frame"></iframe></div>`;
    ROOT.querySelectorAll('.item').forEach(el => el.onclick = () => { sel = +el.dataset.i; ROOT.querySelectorAll('.item').forEach(x => x.classList.toggle('on', x === el)); mostrar(); });
    mostrar();
    $('btnTeste').disabled = $('btnEnviar').disabled = false;
  }

  function mostrar() {
    const e = D.envios[sel];
    $('phead').innerHTML = `<b>Para:</b> ${esc(e.para.split(',').join(', '))}<br><b>Assunto:</b> ${esc(e.assunto)}`;
    $('frame').srcdoc = e.html;
  }

  function enviar(modo) {
    const b1 = $('btnTeste'), b2 = $('btnEnviar');
    b1.disabled = b2.disabled = true;
    msg('info', modo === 'teste' ? `Enviando ${D.envios.length} e-mail(s) de teste para ${esc(D.meuEmail)}…` : 'Enviando…');
    google.script.run.withSuccessHandler(r => {
      b1.disabled = b2.disabled = false;
      msg(r.success ? 'ok' : 'err', (r.success ? '✅ ' : '❌ ') + esc(r.message));
    }).withFailureHandler(err => { b1.disabled = b2.disabled = false; msg('err', '❌ ' + esc(err.message)); }).enviarResumo(modo, null, perJson());
  }

  function msg(t, m) { const el = $('msg'); el.className = 'msg ' + t; el.innerHTML = m; }

})();
</script>
