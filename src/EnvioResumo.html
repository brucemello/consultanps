<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --bg:#f4f6fb; --blue:#2563eb; --blue-soft:#eef3ff;
            --green:#16a34a; --green-soft:#ecfdf3; --red:#dc2626; --red-soft:#fef2f2; --amber:#b45309; --amber-soft:#fff7e6; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
    .wrap { padding:18px; height:100vh; display:flex; flex-direction:column; gap:14px; }
    .hero { background:linear-gradient(120deg,#0b1f3a 0%,#13325e 60%,#1d4ed8 140%); color:#fff; border-radius:16px; padding:16px 22px; display:flex; justify-content:space-between; align-items:center; gap:14px; flex:none; }
    .hero small { text-transform:uppercase; letter-spacing:.12em; font-size:11px; color:#9fb6dc; font-weight:600; }
    .hero h1 { font-size:20px; font-weight:800; margin-top:4px; }
    .hero p { color:#c6d4ee; font-size:13px; margin-top:4px; }
    .btn { display:inline-flex; align-items:center; gap:6px; border-radius:10px; padding:9px 14px; font-weight:600; font-size:13px; border:1px solid transparent; cursor:pointer; font-family:inherit; white-space:nowrap; }
    .btn-primary { background:var(--blue); color:#fff; } .btn-primary:hover { background:#1d4ed8; }
    .btn-light { background:#fff; color:var(--ink); border-color:var(--line); } .btn-light:hover { border-color:#cbd5e1; }
    .btn-ghost { background:rgba(255,255,255,.1); color:#fff; border-color:rgba(255,255,255,.25); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .main { display:grid; grid-template-columns:330px 1fr; gap:14px; flex:1; min-height:0; }
    .side { background:#fff; border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; min-height:0; }
    .side h3 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:14px 14px 6px; }
    .list { overflow:auto; padding:0 8px 8px; flex:1; }
    .item { display:flex; gap:10px; align-items:center; padding:10px; border-radius:10px; cursor:pointer; border:1px solid transparent; }
    .item:hover { background:#f8fafc; }
    .item.on { background:var(--blue-soft); border-color:#c7d7fe; }
    .av { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-weight:800; font-size:12px; flex:none; }
    .av.tl { background:#e0e7ff; color:#3730a3; } .av.g { background:#dcfce7; color:#166534; }
    .item .t { flex:1; min-width:0; }
    .item b { display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .item span { display:block; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nps { font-weight:800; font-size:13px; padding:3px 8px; border-radius:8px; }
    .preview { background:#fff; border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
    .phead { padding:12px 16px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--ink2); line-height:1.6; }
    .phead b { color:var(--ink); }
    iframe { border:0; flex:1; width:100%; background:#eef1f6; }
    .foot { display:flex; align-items:center; gap:10px; flex:none; }
    .msg { flex:1; font-size:13px; border-radius:10px; padding:9px 12px; }
    .msg.ok { background:var(--green-soft); color:var(--green); } .msg.err { background:var(--red-soft); color:var(--red); }
    .msg.warn { background:var(--amber-soft); color:var(--amber); } .msg.info { background:#fff; color:var(--muted); border:1px solid var(--line); }
    .empty { padding:30px; text-align:center; color:var(--muted); }
    .loading { display:grid; place-items:center; flex:1; color:var(--ink2); font-weight:600; }
    .spin { width:30px; height:30px; border:3px solid #dbe3f3; border-top-color:var(--blue); border-radius:50%; animation:s .8s linear infinite; margin:0 auto 10px; }
    @keyframes s { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <small>NPS Produto · Protheus</small>
      <h1>Enviar resumo do NPS</h1>
      <p id="sub">Carregando…</p>
    </div>
    <button class="btn btn-ghost" id="btnCad">👥 Editar cadastro</button>
  </div>

  <div class="main" id="main">
    <div class="loading"><div><div class="spin"></div>Montando os e-mails…</div></div>
  </div>

  <div class="foot">
    <div class="msg info" id="msg">Revise a prévia de cada destinatário antes de enviar.</div>
    <button class="btn btn-light" id="btnTeste" disabled>Enviar teste para mim</button>
    <button class="btn btn-primary" id="btnEnviar" disabled>Enviar para todos</button>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  let D = null, sel = 0;

  $('btnCad').onclick = () => google.script.run.mostrarCadastro();
  $('btnTeste').onclick = () => enviar('teste');
  $('btnEnviar').onclick = () => {
    const n = D.envios.length, tl = D.envios.filter(e => e.tipo === 'TL').length;
    if (!confirm(`Enviar ${n} e-mail(s) agora?\n\n• ${tl} para TLs\n• ${n - tl} para gestores`)) return;
    enviar('real');
  };

  google.script.run.withSuccessHandler(j => { D = JSON.parse(j); render(); })
    .withFailureHandler(e => { $('main').innerHTML = `<div class="empty">Erro ao montar os e-mails: ${esc(e.message)}</div>`; })
    .previewResumo();

  function zona(n) {
    if (n == null) return ['#64748b', '#f1f5f9'];
    if (n >= 75) return ['#067647', '#e3f7ea']; if (n >= 50) return ['#15803d', '#e9f8ef'];
    if (n >= 0) return ['#a15c07', '#fff4dc']; return ['#b42318', '#fdeced'];
  }
  const nomeMes = m => { const [y, mm] = m.split('-'); return `${MESES[+mm - 1]}/${y}`; };
  const fmt = n => n == null ? '—' : n.toFixed(1).replace('.', ',');
  const ini = s => String(s || '?').split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();

  function render() {
    $('sub').textContent = `Período ${D.periodo.inicio} a ${D.periodo.fim} · destaque para ${nomeMes(D.periodo.mesFim)}`;
    if (!D.temDados) msg('warn', 'A Base Histórica está vazia — importe o relatório do Fluig antes de enviar.');
    if (!D.envios.length) {
      $('main').innerHTML = `<div class="side" style="grid-column:1/-1"><div class="empty">Nenhum destinatário ativo.<br><br><button class="btn btn-primary" onclick="google.script.run.mostrarCadastro()">Cadastrar times e gestores</button></div></div>`;
      return;
    }
    const tls = D.envios.map((e, i) => [e, i]).filter(([e]) => e.tipo === 'TL');
    const gs = D.envios.map((e, i) => [e, i]).filter(([e]) => e.tipo === 'Gestor');
    const item = ([e, i]) => { const [c, bg] = zona(e.npsMes); return `<div class="item ${i === sel ? 'on' : ''}" data-i="${i}">
      <div class="av ${e.tipo === 'TL' ? 'tl' : 'g'}">${esc(ini(e.nome))}</div>
      <div class="t"><b>${esc(e.nome)}</b><span>${esc(e.tipo === 'TL' ? 'TL · ' + e.time : e.time)}</span></div>
      <span class="nps" style="color:${c};background:${bg}" title="NPS de ${nomeMes(D.periodo.mesFim)}">${fmt(e.npsMes)}</span></div>`; };
    $('main').innerHTML = `<div class="side">
        <h3>TLs · ${tls.length}</h3><div class="list" style="flex:none">${tls.map(item).join('') || '<div class="empty">Nenhum</div>'}</div>
        <h3>Gestores · ${gs.length}</h3><div class="list">${gs.map(item).join('') || '<div class="empty">Nenhum</div>'}</div>
      </div>
      <div class="preview"><div class="phead" id="phead"></div><iframe id="frame"></iframe></div>`;
    document.querySelectorAll('.item').forEach(el => el.onclick = () => { sel = +el.dataset.i; document.querySelectorAll('.item').forEach(x => x.classList.toggle('on', x === el)); mostrar(); });
    mostrar();
    $('btnTeste').disabled = $('btnEnviar').disabled = false;
  }

  function mostrar() {
    const e = D.envios[sel];
    $('phead').innerHTML = `<b>Para:</b> ${esc(e.para.split(',').join(', '))}<br><b>Assunto:</b> ${esc(e.assunto)}`;
    $('frame').srcdoc = e.html;
  }

  function enviar(modo) {
    const b1 = $('btnTeste'), b2 = $('btnEnviar');
    b1.disabled = b2.disabled = true;
    msg('info', modo === 'teste' ? `Enviando ${D.envios.length} e-mail(s) de teste para ${esc(D.meuEmail)}…` : 'Enviando…');
    google.script.run.withSuccessHandler(r => {
      b1.disabled = b2.disabled = false;
      msg(r.success ? 'ok' : 'err', (r.success ? '✅ ' : '❌ ') + esc(r.message));
    }).withFailureHandler(err => { b1.disabled = b2.disabled = false; msg('err', '❌ ' + esc(err.message)); }).enviarResumo(modo);
  }

  function msg(t, m) { const el = $('msg'); el.className = 'msg ' + t; el.innerHTML = m; }
</script>
</body>
</html>
